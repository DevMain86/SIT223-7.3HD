# SonarCloud analysis for DEV@Deakin

sonar.projectKey=DevMain86_SIT223-7.3HD
sonar.organization=devmain86
sonar.host.url=https://sonarcloud.io
sonar.projectName=DEV@Deakin
sonar.sourceEncoding=UTF-8

# Production code
sonar.sources=server/src,frontend/src

# Generated output, dependencies and test files are not production sources
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/test-results/**,**/*.test.ts,**/*.test.tsx

# Test code, analysed with test-specific rules
sonar.tests=server/tests,frontend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Coverage produced by the Test stage, from both projects
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,frontend/coverage/lcov.info

sonar.coverage.exclusions=server/src/index.ts,server/src/firebaseAdmin.ts,server/src/types/**,frontend/src/main.tsx,frontend/src/test/**