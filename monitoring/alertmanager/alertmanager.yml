# Alertmanager: routes firing alerts to email via SendGrid.

global:
  smtp_smarthost: "smtp.sendgrid.net:587"
  smtp_from: "stumain22@gmail.com"
  smtp_auth_username: "apikey"
  smtp_auth_password_file: /etc/alertmanager/smtp_password
  smtp_require_tls: true

route:
  receiver: email
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: email
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: email
    email_configs:
      - to: "stumain22@gmail.com"
        send_resolved: true
        tls_config:
          insecure_skip_verify: true
        headers:
          Subject: '{{ .Status | toUpper }}: {{ .CommonAnnotations.summary }}'

inhibit_rules:
  - source_matchers:
      - alertname = "APIDown"
    target_matchers:
      - severity = "warning"
    equal: ["environment"]