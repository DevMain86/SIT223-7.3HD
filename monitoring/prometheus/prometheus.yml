# Prometheus configuration for DEV@Deakin.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: devdeakin-api
    metrics_path: /metrics
    static_configs:
      - targets: ["server:3000"]
        labels:
          service: api

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Prometheus monitoring itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]