

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://server:3000;

    # Security headers on every response, including proxied API responses
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~* ^/api/+metrics/?$ {
        return 404;
    }

    # API: strip the /api prefix and forward to the Express container
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Liveness check for the container HEALTHCHECK
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints asset filenames, so they can be cached for a year
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routing: unknown paths return index.html so React Router can handle
    # them, meaning a refresh on /browse works instead of returning a 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}